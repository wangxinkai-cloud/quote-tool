/* ============ 通用工具函数 ============ */
const $ = (key, name) => document.getElementById(`${key}__${name}`);

function fmtNum(value, digits = 2) {
  if (!isFinite(value)) return "";
  return value.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
}
function fmtPct(value, digits = 2) {
  if (!isFinite(value)) return "";
  return (value * 100).toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits }) + "%";
}

// 手机数字键盘可能用逗号当小数点；同时出现逗号和句号时，以最后出现的那个作为小数点。
function normalizeNumberString(raw) {
  const hasComma = raw.includes(",");
  const hasDot = raw.includes(".");
  if (hasComma && hasDot) {
    if (raw.lastIndexOf(",") > raw.lastIndexOf(".")) {
      return raw.replace(/\./g, "").replace(",", ".");
    }
    return raw.replace(/,/g, "");
  }
  if (hasComma) return raw.replace(",", ".");
  return raw;
}

function readNumber(key, name, label) {
  const raw = $(key, name).value.trim();
  if (raw === "") throw new Error(`${label}不能为空`);
  const v = Number(normalizeNumberString(raw));
  if (!isFinite(v)) throw new Error(`${label}输入格式不正确：${raw}`);
  return v;
}

// 接受 0.07 / 7 / 7% 三种写法
function readPercent(key, name, label) {
  const raw = $(key, name).value.trim();
  if (raw === "") throw new Error(`${label}不能为空`);
  const hasPercentSign = raw.endsWith("%");
  const v = Number(normalizeNumberString(raw.replace(/%$/, "").trim()));
  if (!isFinite(v)) throw new Error(`${label}输入格式不正确：${raw}`);
  if (hasPercentSign || v > 1) return v / 100;
  return v;
}

// 可留空的数字输入：留空返回 null
function readOptionalNumber(key, name, label) {
  return $(key, name).value.trim() === "" ? null : readNumber(key, name, label);
}

// 数字输入框离开后，把手机键盘打出的 2,5 / 1,199.3 整理成标准小数 2.5 / 1199.3（计算本来就认这两种写法，这里只是让显示一致）
function tidyNumberInput(el) {
  const raw = el.value.trim();
  if (!/^[\d.,]+%?$/.test(raw)) return;
  const pct = raw.endsWith("%");
  const body = pct ? raw.slice(0, -1) : raw;
  const fixed = normalizeNumberString(body);
  if (fixed !== body && isFinite(Number(fixed))) el.value = fixed + (pct ? "%" : "");
}

  const seriesLabel = { "440": "440 系列", "500矩形": "500 矩形", "595": "595 系列", "620": "620 系列", "700": "700 系列" };
  let html = "";
  let current = null;
  MODULE_PRESETS.forEach((p, i) => {
    if (p.series !== current) {
      if (current !== null) html += "</optgroup>";
      html += `<optgroup label="${seriesLabel[p.series]}">`;
      current = p.series;
    }
    const note = p.div > 1 ? `（含税${p.raw}÷${p.div}）` : "";
    html += `<option value="${valuePrefix}${i}">${p.w}W · ${withPcs ? p.pcs + "片 · " : ""}成本${p.cost}${note}</option>`;
  });
  return html + "</optgroup>";
}

/* ============ 计算 ============ */
// 读取费用参数；只读取当前贸易条款会用到的项（其余项对应的输入框是锁定的，不参与计算）
function readFeeContext(key, term, taxCtx) {
  const rel = (name) => FEE_RELEVANCE[name].includes(term);
  const num = (name, label) => (rel(name) ? readNumber(key, name, label) : 0);
  const ctx = {
    chinaPerCab: num("china_export_fee_per_cabinet_rmb", "中国端费用/柜"),
    fobExtraPerCab: num("fob_extra_fee_per_cabinet_rmb", "FOB附加费用/柜"),
    oceanPerCabUsd: num("ocean_freight_per_cabinet_usd", "海运费/柜（USD）"),
    destPerCabEur: num("destination_fee_per_cabinet_eur", "目的港基础费用/柜"),
    ddpExtraPerCabEur: num("ddp_extra_per_cabinet_eur", "DDP附加费用/柜"),
    insuranceRate: num("insurance_rate", "保险费率"),
    annualRate: readNumber(key, "annual_interest_rate", "资金年利率"),
    capitalMonths: readNumber(key, "capital_months", "资金占用月数"),
    capitalRatio: readNumber(key, "capital_ratio", "资金占用比例"),
    companyRate: readNumber(key, "company_expense_rate", "公司费用率"),
    usdRate: 0,
  };
  if (ctx.oceanPerCabUsd !== 0) {
    // 海运费按美元计，需要美元汇率换算成人民币；“进项和销项税”下用锁汇汇率（USD）
    ctx.usdRate = taxCtx ? readNumber(key, "lock_usd", "锁汇汇率（USD）") : readNumber(key, "usd_rate", "美元汇率");
    if (ctx.usdRate <= 0) throw new Error("美元汇率必须大于0");
  }
  return ctx;
}

// 某个贸易条款下，一批货（cabinets 个柜）的固定费用；保险费随收入变化，在 solveOrder 里单独处理
function termFees(ctx, term, cabinets, rate) {
  let chinaExportFee = 0, oceanFreightFixed = 0, useInsurance = false, destinationFee = 0;
  if (term === "FCA") {
    chinaExportFee = ctx.chinaPerCab * cabinets;
  } else if (term === "FOB") {
    chinaExportFee = (ctx.chinaPerCab + ctx.fobExtraPerCab) * cabinets;
  } else if (term === "CIF" || term === "DDP") {
    chinaExportFee = (ctx.chinaPerCab + ctx.fobExtraPerCab) * cabinets;
    oceanFreightFixed = ctx.oceanPerCabUsd * ctx.usdRate * cabinets;   // 美元海运费 × USD/CNY → 人民币
    useInsurance = true;
    if (term === "DDP") destinationFee = (ctx.destPerCabEur + ctx.ddpExtraPerCabEur) * cabinets * rate;
  }
  return { chinaExportFee, oceanFreightFixed, useInsurance, destinationFee };
}

// 毛利率/净利率都是"总收入"的占比，保险费、资金占用利息、公司费用均随总收入等比例变化，
// 因此可以反解出满足目标利润率所需的最小总收入。
// cost：这批货的不含税总成本；cabinets：柜数（运费等按柜计，同柜装运的货合并成一批，运费只算一次）。
// targetGross / targetNet 为 null 表示不参与；同时给出时取需要总收入更高的那个，使两项目标都满足。
// tax 不为空时，按“进项和销项税”（表格的“0%退税后测算”）计算，见 solveOrderTax。
function solveOrder({ cost, cabinets, quantityW, rate, term, ctx, targetGross, targetNet, labels, tax = null }) {
  const f = termFees(ctx, term, cabinets, rate);
  const insuranceK = f.useInsurance ? ctx.insuranceRate : 0;
  const capitalK = (ctx.annualRate / 12) * ctx.capitalMonths * ctx.capitalRatio;
  const companyK = ctx.companyRate;
  if (tax) return solveOrderTax({ f, cost, quantityW, rate, term, insuranceK, capitalK, companyK, targetGross, targetNet, labels, tax });

  const fixedCosts = cost + f.chinaExportFee + f.oceanFreightFixed + f.destinationFee;
  const candidates = [];
  if (targetGross !== null) {
    const denom = 1 - targetGross - insuranceK - capitalK;
    if (denom <= 0) throw new Error(`${labels.gross}过高，当前费用结构下无法实现，请降低目标或检查费用参数。`);
    candidates.push(fixedCosts / denom);
  }
  if (targetNet !== null) {
    const denom = 1 - targetNet - insuranceK - capitalK - companyK;
    if (denom <= 0) throw new Error(`${labels.net}过高，当前费用结构下无法实现，请降低目标或检查费用参数。`);
    candidates.push(fixedCosts / denom);
  }
  const totalIncomeRmb = Math.max(...candidates);

  const freightInsurance = f.oceanFreightFixed + insuranceK * totalIncomeRmb;
  const capitalInterest = capitalK * totalIncomeRmb;
  const companyExpense = companyK * totalIncomeRmb;
  const totalExpense = f.chinaExportFee + freightInsurance + f.destinationFee + capitalInterest + companyExpense;
  const grossProfit = totalIncomeRmb - cost - f.chinaExportFee - freightInsurance - f.destinationFee - capitalInterest;
  const netProfit = totalIncomeRmb - cost - totalExpense;
  return {
    totalCost: cost, china: f.chinaExportFee, freightInsurance, dest: f.destinationFee,
    capitalInterest, companyExpense, totalExpense, grossProfit, netProfit, totalIncomeRmb,
    foreignIncomeEur: totalIncomeRmb / rate,
    unitPriceEurPerW: totalIncomeRmb / (rate * quantityW),
    grossMargin: grossProfit / totalIncomeRmb,
    netMargin: netProfit / totalIncomeRmb,
    tax: null,
  };
}

// “进项和销项税”（对应表格 14、15 行，0% 退税后测算）。J = 外币收入（EUR），K = 锁汇汇率（EUR），T = 税务局汇率（EUR）：
//   FOB价（EUR）   = J − 运费 − 保费（CIF）；J − 运费 − 保费 − 目的港/DDP 费用（DDP）；J（FOB）
//   销项税（RMB）  = FOB价（EUR）× T ÷ 1.13 × 13%        （表格里经 USD 折算，K8 相消）
//   税后收入（RMB）= J × K − 销项税
//   毛利润（RMB）  = 税后收入 − 不含税成本 − 费用（不含公司费用）；毛利率 = 毛利润 ÷ 税后收入
//   净利润         = 毛利润 − 公司费用；净利率 = 净利润 ÷ 税前收入（J × K）
// 以上对 J 都是一次式，所以可以按目标利润率直接反解 J。
function solveOrderTax({ f, cost, quantityW, rate, term, insuranceK, capitalK, companyK, targetGross, targetNet, labels, tax }) {
  const K = rate, S = cost;
  const feeRmb = f.chinaExportFee + f.oceanFreightFixed + f.destinationFee;
  const n = tax.taxEur * 0.13 / 1.13;                       // 每 1 EUR 的 FOB 价对应的销项税（RMB）
  let a = 1, b = 0;                                          // FOB价（EUR）= a × J − b
  if (term === "CIF") { a = 1 - insuranceK; b = f.oceanFreightFixed / K; }
  else if (term === "DDP") { a = 1 - insuranceK; b = (f.oceanFreightFixed + f.destinationFee) / K; }
  const o1 = K - n * a, o0 = n * b;                          // 税后收入 = o1 × J + o0
  const c1 = o1 - K * (insuranceK + capitalK);               // 毛利润   = c1 × J + c0
  const c0 = o0 - S - feeRmb;

  const candidates = [];
  if (targetGross !== null) {
    const d = c1 - targetGross * o1;
    const j = (targetGross * o0 - c0) / d;
    if (!(d > 0 && j > 0)) throw new Error(`${labels.gross}过高，当前费用结构下无法实现，请降低目标或检查费用参数。`);
    candidates.push(j);
  }
  if (targetNet !== null) {
    const d = c1 - K * (targetNet + companyK);
    const j = -c0 / d;
    if (!(d > 0 && j > 0)) throw new Error(`${labels.net}过高，当前费用结构下无法实现，请降低目标或检查费用参数。`);
    candidates.push(j);
  }
  const J = Math.max(...candidates);

  const L = K * J;
  const fobEur = a * J - b;
  const outputVat = n * fobEur;
  const afterTaxIncome = L - outputVat;
  const freightInsurance = f.oceanFreightFixed + insuranceK * L;
  const capitalInterest = capitalK * L;
  const companyExpense = companyK * L;
  const totalExpense = f.chinaExportFee + freightInsurance + f.destinationFee + capitalInterest + companyExpense;
  const grossProfit = afterTaxIncome - S - (f.chinaExportFee + freightInsurance + f.destinationFee + capitalInterest);
  const netProfit = grossProfit - companyExpense;
  return {
    totalCost: S, china: f.chinaExportFee, freightInsurance, dest: f.destinationFee,
    capitalInterest, companyExpense, totalExpense, grossProfit, netProfit, totalIncomeRmb: L,
    foreignIncomeEur: J,
    unitPriceEurPerW: J / quantityW,
    grossMargin: grossProfit / afterTaxIncome,
    netMargin: netProfit / L,
    tax: { fobEur, fobUsd: tax.taxUsd ? fobEur * tax.taxEur / tax.taxUsd : null, outputVat, afterTaxIncome },
  };
}

// 可留空的利润率输入：留空返回 null
function readOptionalPercent(key, name, label) {
  return $(key, name).value.trim() === "" ? null : readPercent(key, name, label);
}

// “进项和销项税”是否生效：勾选了，并且贸易条款是 FOB / CIF / DDP
function taxActive(key) {
  return $(key, "tax_on").checked && TAX_TERMS.includes($(key, "trade_term").value);
}

// 生效时读取税务局汇率和锁汇汇率（EUR）；不生效返回 null
function getTaxContext(key, term) {
  if (!$(key, "tax_on").checked || !TAX_TERMS.includes(term)) return null;
  const taxEur = readNumber(key, "tax_eur", "税务局汇率（EUR）");
  const lockEur = readNumber(key, "lock_eur", "锁汇汇率（EUR）");
  if (taxEur <= 0 || lockEur <= 0) throw new Error("税务局汇率和锁汇汇率必须大于0");
  return { taxEur, taxUsd: readOptionalNumber(key, "tax_usd", "税务局汇率（USD）"), lockEur };
}

// 状态栏里的补充说明
function taxStatusNote(key, taxCtx) {
  if (taxCtx) return "，进项和销项税";
  return $(key, "tax_on").checked ? "（进项和销项税仅用于 FOB、CIF、DDP，本次按原逻辑计算）" : "";
}

// 把一批货的求解结果写进“输出结果”卡片
function putMainOutputs(key, r, quantityW, rate) {
  const put = (n, v) => { const el = $(key, n); if (el) el.value = v; };
  put("unit_price_eur", fmtNum(r.unitPriceEurPerW, 4));
  put("quantity_w", fmtNum(quantityW, 2));
  put("quantity_MW", fmtNum(quantityW / 1000000, 6));
  put("foreign_income_eur", fmtNum(r.foreignIncomeEur, 2));
  put("total_income_rmb", fmtNum(r.totalIncomeRmb, 2));
  put("fob_eur", r.tax ? fmtNum(r.tax.fobEur, 2) : "");
  put("fob_usd", r.tax && r.tax.fobUsd !== null ? fmtNum(r.tax.fobUsd, 2) : "");
  put("output_vat", r.tax ? fmtNum(r.tax.outputVat, 2) : "");
  put("after_tax_income", r.tax ? fmtNum(r.tax.afterTaxIncome, 2) : "");
  put("total_cost_excl_tax", fmtNum(r.totalCost, 2));
  put("china_export_fee", fmtNum(r.china, 2));
  put("freight_insurance", fmtNum(r.freightInsurance, 2));
  put("destination_fee", fmtNum(r.dest, 2));
  put("capital_interest", fmtNum(r.capitalInterest, 2));
  put("company_expense", fmtNum(r.companyExpense, 2));
  put("total_expense", fmtNum(r.totalExpense, 2));
  put("gross_profit_rmb", fmtNum(r.grossProfit, 2));
  put("gross_margin", fmtPct(r.grossMargin, 2));
  put("net_profit_rmb", fmtNum(r.netProfit, 2));
  put("net_margin", fmtPct(r.netMargin, 2));
  put("budget_profit_rmb", fmtNum(r.netProfit, 2));
  put("budget_profit_eur", fmtNum(r.netProfit / rate, 2));
}

function calculate(key) {
  if (key === "carport") return calculateCarport();
  clearError();
  const T = TOOLS[key];
  try {
    const modelW = readNumber(key, "model_w", T.modelName);
    const count = readNumber(key, "pieces", T.countName);
    const cabinets = readNumber(key, "cabinets", "柜数");
    const costRmb = readNumber(key, "cost_rmb", T.costName);
    const term = $(key, "trade_term").value;
    if (!term) throw new Error("请选择贸易条款");
    const taxCtx = getTaxContext(key, term);
    const rate = taxCtx ? taxCtx.lockEur : readNumber(key, "rate", "汇率");
    if (rate === 0) throw new Error("汇率不能为0");

    const targetGross = readPercent(key, "target_gross_margin", "目标毛利率");
    const targetNet = readPercent(key, "target_net_margin", "目标净利率");
    const ctx = readFeeContext(key, term, taxCtx);

    const quantityW = T.qtyMode === "perCabinet" ? modelW * count * cabinets : modelW * count;
    if (quantityW === 0) {
      throw new Error(T.qtyMode === "perCabinet" ? "型号/片数/柜数不能为0" : `${T.modelName}/${T.countName}不能为0`);
    }
    const costDivisor = taxCtx ? 1.13 : T.costDivisor;   // 进项：含税采购成本 ÷1.13
    const r = solveOrder({
      cost: quantityW * costRmb / costDivisor, cabinets, quantityW, rate, term, ctx, targetGross, targetNet,
      labels: { gross: "目标毛利率", net: "目标净利率" }, tax: taxCtx,
    });
    putMainOutputs(key, r, quantityW, rate);

    const value = $(key, "price_value"), unit = $(key, "price_unit"), sub = $(key, "price_sub");
    if (T.price.kind === "perUnit") {
      value.textContent = fmtNum(r.unitPriceEurPerW * modelW, 2);
      unit.textContent = "EUR / 台";
      sub.textContent = `单价 ${fmtNum(r.unitPriceEurPerW, 4)} EUR/W × ${fmtNum(modelW, 0)} W`;
    } else {
      value.textContent = fmtNum(r.unitPriceEurPerW, 4);
      unit.textContent = "EUR / W";
      sub.textContent = "";
    }
    setStatus(key, `计算完成：当前条款 ${term}${taxStatusNote(key, taxCtx)}`);
  } catch (e) {
    showError(e.message);
    setStatus(key, "计算失败");
  }
}

// Carport 三种模式：
//  bracket：纯支架；
//  combo  ：支架+组件同柜装运，运费只算一次，共用费用按成本占比分摊给支架和组件，分别得到 EUR/W 单价；
//  space  ：在 combo 的基础上，整体按单独的车位目标利润率定价，得到 EUR/车位。
function calculateCarport() {
  const key = "carport";
  clearError();
  const T = TOOLS.carport;
  try {
    const mode = carportMode;
    const modelW = readNumber(key, "model_w", "型号");
    const count = readNumber(key, "pieces", "片数");
    const cabinets = readNumber(key, "cabinets", "柜数");
    const bracketCostPerW = readNumber(key, "cost_rmb", "支架采购成本");
    const term = $(key, "trade_term").value;
    if (!term) throw new Error("请选择贸易条款");
    const taxCtx = getTaxContext(key, term);
    const rate = taxCtx ? taxCtx.lockEur : readNumber(key, "rate", "汇率");
    if (rate === 0) throw new Error("汇率不能为0");

    const targetGross = readPercent(key, "target_gross_margin", "目标毛利率");
    const targetNet = readPercent(key, "target_net_margin", "目标净利率");
    const ctx = readFeeContext(key, term, taxCtx);

    let spaces = null;
    if (mode === "space" && $(key, "spaces").value.trim() !== "") {
      spaces = readNumber(key, "spaces", "车位数");
      if (spaces <= 0) throw new Error("车位数必须大于0");
    }

    const quantityW = modelW * count;
    if (quantityW === 0) throw new Error("型号/片数不能为0");
    const labels = { gross: "目标毛利率", net: "目标净利率" };
    const bracketCost = quantityW * bracketCostPerW / (taxCtx ? 1.13 : T.costDivisor);

    let primary, bracketPrice, modulePrice = null, split = null, ownTargets = false;
    if (mode === "bracket") {
      primary = solveOrder({ cost: bracketCost, cabinets, quantityW, rate, term, ctx, targetGross, targetNet, labels, tax: taxCtx });
      bracketPrice = primary.unitPriceEurPerW;
    } else {
      // 组件成本：进项和销项税下按含税价 ÷1.13
      const moduleCost = quantityW * readNumber(key, "m_cost", "组件成本") / (taxCtx ? 1.13 : 1);
      const batchCost = bracketCost + moduleCost;
      if (batchCost <= 0) throw new Error("支架和组件的成本必须大于0");
      // 同柜装运：支架+组件合成一批货，柜数（运费）只算一次
      primary = solveOrder({ cost: batchCost, cabinets, quantityW, rate, term, ctx, targetGross, targetNet, labels, tax: taxCtx });
      const bracketShare = bracketCost / batchCost;
      const bracketIncome = primary.totalIncomeRmb * bracketShare;
      const moduleIncome = primary.totalIncomeRmb - bracketIncome;
      bracketPrice = bracketIncome / (rate * quantityW);
      modulePrice = moduleIncome / (rate * quantityW);
      split = { bracketShare, bracketIncome, moduleIncome, bracketCost, moduleCost };

      if (mode === "space") {
        const pg = readOptionalPercent(key, "p_target_gross_margin", "车位目标毛利率");
        const pn = readOptionalPercent(key, "p_target_net_margin", "车位目标净利率");
        ownTargets = pg !== null || pn !== null;
        primary = solveOrder({
          cost: batchCost, cabinets, quantityW, rate, term, ctx,
          targetGross: ownTargets ? pg : targetGross,
          targetNet: ownTargets ? pn : targetNet,
          labels: ownTargets ? { gross: "车位目标毛利率", net: "车位目标净利率" } : labels,
          tax: taxCtx,
        });
      }
    }

    putMainOutputs(key, primary, quantityW, rate);
    const put = (n, v) => { $(key, n).value = v; };
    put("s_cabinets", fmtNum(cabinets, 0));
    put("s_bracket_share", split ? fmtPct(split.bracketShare, 1) : "");
    put("s_bracket_price", split ? fmtNum(bracketPrice, 4) : "");
    put("s_bracket_income", split ? fmtNum(split.bracketIncome, 2) : "");
    put("s_bracket_cost", split ? fmtNum(split.bracketCost, 2) : "");
    put("s_module_price", split ? fmtNum(modulePrice, 4) : "");
    put("s_module_income", split ? fmtNum(split.moduleIncome, 2) : "");
    put("s_module_cost", split ? fmtNum(split.moduleCost, 2) : "");

    $(key, "price_bracket").textContent = fmtNum(bracketPrice, 4);
    $(key, "price_module").textContent = modulePrice === null ? "--" : fmtNum(modulePrice, 4);
    const notes = [];
    if (mode === "combo") {
      notes.push(`同柜装运：运费只算一次，共用费用按成本占比分摊（支架 ${fmtPct(split.bracketShare, 1)}）`);
    } else if (mode === "space") {
      if (spaces) {
        $(key, "price_space").textContent = fmtNum(primary.foreignIncomeEur / spaces, 2);
        notes.push(`整体 ${fmtNum(primary.unitPriceEurPerW, 4)} EUR/W · 共 ${fmtNum(spaces, 0)} 个车位`);
      } else {
        $(key, "price_space").textContent = "--";
        notes.push("填写“车位数”后显示车位报价单价");
      }
      if (!ownTargets) notes.push("未填车位目标利润率：车位报价按单项目标计算");
    }
    $(key, "price_sub").textContent = notes.join("\n");
    setStatus(key, `计算完成：${CARPORT_MODES[mode].name}，当前条款 ${term}${taxStatusNote(key, taxCtx)}`);
  } catch (e) {
    showError(e.message);
    setStatus(key, "计算失败");
  }
}

function clearOutputs(key) {
  const T = TOOLS[key];
  [...(T.extraOutputs || []), ...OUTPUTS, ...(T.splitOutputs || [])].forEach(([, n]) => { $(key, n).value = ""; });
  if (T.price.kind === "carport") {
    ["price_bracket", "price_module", "price_space"].forEach((n) => { $(key, n).textContent = "--"; });
  } else {
    $(key, "price_value").textContent = "--";
    $(key, "price_unit").textContent = T.price.unit;
  }
  $(key, "price_sub").textContent = "";
  setStatus(key, "输出已清空");
  clearError();
}

/* ============ 汇率 ============ */
async function fetchCnyRate(from) {
  const resp = await fetch(`https://api.frankfurter.dev/v1/latest?from=${from}&to=CNY`);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  const rate = data.rates && data.rates.CNY;
  if (!rate) throw new Error("响应中未找到CNY汇率");
  return rate;
}

// 同时刷新欧元汇率（EUR/CNY，报价收入用）和美元汇率（USD/CNY，海运费换算用）
async function refreshRate(key) {
  const keys = key ? [key] : Object.keys(TOOLS);
  keys.forEach((k) => setStatus(k, "正在获取实时汇率…"));
  const [eur, usd] = await Promise.allSettled([fetchCnyRate("EUR"), fetchCnyRate("USD")]);
  const notes = [], failures = [];
  [[eur, "rate", "EUR/CNY", "8"], [usd, "usd_rate", "USD/CNY", ""]].forEach(([result, field, label, fallback]) => {
    if (result.status === "fulfilled") {
      Object.keys(TOOLS).forEach((k) => { $(k, field).value = result.value; });
      notes.push(`${label} ${result.value}`);
    } else {
      failures.push(`${label}：${result.reason.message}`);
      if (fallback) Object.keys(TOOLS).forEach((k) => { if (!$(k, field).value.trim()) $(k, field).value = fallback; });
    }
  });
  let msg = notes.length ? `已获取实时汇率：${notes.join("；")}（数据源：frankfurter.dev，基于ECB参考汇率）` : "";
  if (failures.length) msg += (msg ? "；" : "") + `汇率获取失败，已保留手动值（${failures.join("；")}）`;
  keys.forEach((k) => setStatus(k, msg));
  if (key && failures.length) showError(`未能自动获取汇率，请检查网络或稍后重试，也可手动输入。\n\n${failures.join("\n")}`);
}

/* ============ 图纸识别（Carport） ============ */
const PDFJS_SRC = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const TESS_SRC = "https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js";
const scriptPromises = {};

function loadScript(src) {
  if (!scriptPromises[src]) {
    scriptPromises[src] = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => { delete scriptPromises[src]; reject(new Error("无法加载识别组件，请检查网络后重试")); };
      document.head.appendChild(s);
    });
  }
  return scriptPromises[src];
}

// 在图纸文字里找“Solarmodule”一段：功率（W）+ 数量（Stk），并用图纸上的 DC 功率交叉校验。
function parseDrawingText(raw) {
  const text = raw.replace(/ /g, " ");
  const anchorRe = /(Solarmodul\w*|PV[- ]?Modul\w*|Photovoltaic modules?|PV modules?|Solar modules?|光伏组件)/gi;
  const stopRe = /(Wechselrichter|Inverter|C&I|Speicher|Battery|Legende|Legend|逆变器|储能)/i;
  let m, found = null;
  while ((m = anchorRe.exec(text)) && !found) {
    let win = text.slice(m.index + m[0].length, m.index + m[0].length + 700);
    const stop = win.search(stopRe);
    if (stop > 15) win = win.slice(0, stop);

    const pw = win.match(/(?:Leistung|Power|Nennleistung|功率)\s*[:：]?\s*(\d{1,4}(?:[.,]\d+)?)\s*(kWp|kW|Wp|W)\b/i);
    if (!pw) continue;
    let watt = Number(pw[1].replace(",", "."));
    if (/^kw/i.test(pw[2]) && watt < 20) watt *= 1000;   // 图纸里常把 635 W 写成 “635 kWp”
    if (!(watt >= 100 && watt <= 1000)) continue;

    const cnt = win.match(/(?:Anzahl|Quantity|Qty|数量)\s*[:：]?\s*(\d{1,6})/i)
      || win.match(/(\d{1,6})\s*(?:Stk|Stück|pcs|pieces|片|块)/i);
    found = { watt, count: cnt ? Number(cnt[1]) : null };
  }
  if (!found) return null;

  const dc = text.match(/DC\s*-?\s*(?:Leistung|Power)\s*[:：]?\s*(\d{1,5}(?:[.,]\d+)?)\s*kWp/i);
  if (dc) {
    const expected = Number(dc[1].replace(",", ".")) * 1000 / found.watt;
    const clean = Math.abs(expected - Math.round(expected)) < 0.1;
    if (found.count === null && clean) {
      found.count = Math.round(expected);
      found.note = `片数由图纸 DC 功率 ${dc[1]} kWp ÷ ${found.watt} W 推算`;
    } else if (found.count !== null && Math.abs(found.count - expected) <= 0.6) {
      found.note = `与图纸 DC 功率 ${dc[1]} kWp 校验一致`;
    } else if (found.count !== null && clean) {
      found.note = `识别到 ${found.count} 片，但与 DC 功率 ${dc[1]} kWp 推算的 ${Math.round(expected)} 片不一致，已按 ${Math.round(expected)} 片填入，请核对图纸`;
      found.count = Math.round(expected);
    } else if (found.count !== null) {
      found.note = `注意：${found.watt} W × ${found.count} 片与图纸 DC 功率 ${dc[1]} kWp 对不上，请人工核对`;
    }
  }
  return found.count === null ? null : found;
}

function cropCanvas(src, [x0, y0, x1, y1]) {
  const c = document.createElement("canvas");
  c.width = Math.round(src.width * (x1 - x0));
  c.height = Math.round(src.height * (y1 - y0));
  c.getContext("2d").drawImage(src, Math.round(src.width * x0), Math.round(src.height * y0), c.width, c.height, 0, 0, c.width, c.height);
  return c;
}

async function fileToCanvas(file, onStatus) {
  const targetWidth = 4000;
  const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
  if (isPdf) {
    onStatus("正在读取 PDF…");
    await loadScript(PDFJS_SRC);
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    return { pdf, canvas: null };
  }
  const bmp = await createImageBitmap(file);
  const scale = Math.min(2, targetWidth / bmp.width);
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return { pdf: null, canvas: c };
}

async function analyzeDrawing(file, onStatus) {
  let { pdf, canvas } = await fileToCanvas(file, onStatus);
  if (pdf) {
    // 1) 先试 PDF 自带的文字层
    let layerText = "";
    for (let p = 1; p <= Math.min(pdf.numPages, 3); p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      layerText += "\n" + tc.items.map((i) => i.str).join("\n");
    }
    const direct = parseDrawingText(layerText);
    if (direct) return { ...direct, via: "PDF文字" };
    // 2) 文字层里没有（图纸里的参数表常被转成图片）：渲染第 1 页做 OCR
    onStatus("正在渲染图纸…");
    const page = await pdf.getPage(1);
    const base = page.getViewport({ scale: 1 });
    const viewport = page.getViewport({ scale: 4000 / base.width });
    canvas = document.createElement("canvas");
    canvas.width = Math.round(viewport.width);
    canvas.height = Math.round(viewport.height);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
  }

  onStatus("正在识别图纸文字（首次需下载识别组件，约十几秒）…");
  await loadScript(TESS_SRC);
  const worker = await Tesseract.createWorker("eng", 1, {
    logger: (m) => { if (m.status === "recognizing text") onStatus(`正在识别图纸文字… ${Math.round(m.progress * 100)}%`); },
  });
  try {
    await worker.setParameters({ tessedit_pageseg_mode: "6" });
    // 参数表通常在图纸右侧或左侧；先识别这些区域，找不到再扫整页。
    const regions = [[0.7, 0, 1, 0.7], [0, 0, 0.3, 0.7], [0.7, 0.3, 1, 1], [0, 0, 1, 1]];
    let allText = "";
    for (const r of regions) {
      const { data } = await worker.recognize(cropCanvas(canvas, r));
      allText += "\n" + data.text;
      const found = parseDrawingText(allText);
      if (found) return { ...found, via: "OCR" };
    }
  } finally {
    await worker.terminate();
  }
  return null;
}

async function handleDrawingFile(file) {
  const key = "carport";
  const status = $(key, "upload_status");
  const onStatus = (t) => { status.textContent = t; };
  try {
    onStatus("正在分析图纸…");
    const info = await analyzeDrawing(file, onStatus);
    if (!info) {
      onStatus("没有在图纸里找到组件功率和数量，请手动输入型号和片数。");
      return;
    }
    $(key, "model_w").value = info.watt;
    $(key, "pieces").value = info.count;
    $(key, "preset").value = "";
    updateCabinetEstimate();
    onStatus(`已识别（${info.via}）：${info.watt} W × ${info.count} 片，已填入，请核对。${info.note ? "\n" + info.note : ""}`);
  } catch (e) {
    onStatus(`识别失败：${e.message}。请手动输入型号和片数。`);
  }
}

/* ============ Carport 界面逻辑：模式切换、装柜容量、柜数估算（整车位） ============ */
let carportMode = "bracket";
let cabinetsDirty = false;   // 用户手动输入过柜数后，不再自动覆盖

function applyModeVisibility() {
  document.querySelectorAll("#tool-carport [data-modes]").forEach((el) => {
    el.hidden = !el.dataset.modes.split(" ").includes(carportMode);
  });
  // 价格卡片：整车位模式突出车位报价；其他模式突出支架/组件单价
  document.querySelectorAll("#tool-carport .price-row").forEach((row) => {
    row.classList.toggle("main", carportMode === "space" ? row.dataset.row === "space" : row.dataset.row !== "space");
  });
}

// 车棚类型和柜型都选了以后，带入带组件时的每柜容量和每套车位数（可再手动修改）；没选就不动，由你自己填
function applyCarportPacking() {
  const type = $("carport", "pack_type").value, container = $("carport", "pack_container").value;
  if (!type || !container) return;
  const p = CARPORT_PACKING[type][container];
  $("carport", "sets_per_cab").value = p.setsWithModule;
  $("carport", "mods_per_cab").value = p.modules;
  $("carport", "spaces_per_set").value = 2;   // 一套 = 一个双车位 = 2 个车位
}

// 整车位模式：按车位数和片数，用每柜容量估算柜数（支架和组件同柜，取较大者）
function updateCabinetEstimate() {
  if (carportMode !== "space") return;
  const key = "carport";
  const num = (n) => {
    const raw = $(key, n).value.trim();
    if (raw === "") return null;
    const v = Number(normalizeNumberString(raw));
    return isFinite(v) && v > 0 ? v : null;
  };
  const ceilCab = (x) => Math.max(1, Math.ceil(x - 1e-9));
  const spaces = num("spaces"), setsPerCab = num("sets_per_cab"), spacesPerSet = num("spaces_per_set") || 2;
  const pieces = num("pieces"), modsPerCab = num("mods_per_cab");
  const cabinets = $(key, "cabinets"), hint = $(key, "cabinets_hint");

  const parts = [];
  if (spaces && setsPerCab) {
    const sets = spaces / spacesPerSet;
    const n = ceilCab(sets / setsPerCab);
    parts.push({ n, text: `车位 ${fmtNum(spaces, 0)} ÷ ${spacesPerSet} = ${fmtNum(sets, 1)} 套，每柜 ${setsPerCab} 套 → ${n} 柜` });
  }
  if (pieces && modsPerCab) {
    const n = ceilCab(pieces / modsPerCab);
    parts.push({ n, text: `组件 ${fmtNum(pieces, 0)} 片，每柜 ${modsPerCab} 片 → ${n} 柜` });
  }
  if (!parts.length) {
    hint.textContent = "选择车棚类型和柜型（或手动填每柜容量），再填车位数和片数，即可自动估算柜数；也可以直接手动输入柜数。";
    if (!cabinetsDirty) cabinets.value = "";
    return;
  }
  const est = Math.max(...parts.map((p) => p.n));
  hint.textContent = "估算：" + parts.map((p) => p.text).join("；") + (parts.length > 1 ? ` → 取 ${est} 柜` : "")
    + (cabinetsDirty ? `（当前为手动输入，估算值 ${est}）` : "");
  if (!cabinetsDirty) cabinets.value = est;
}

function setCarportMode(mode) {
  const cabinets = $("carport", "cabinets");
  carportMode = mode;
  document.querySelectorAll("#carport__mode_seg button").forEach((b) => b.classList.toggle("active", b.dataset.mode === mode));
  $("carport", "mode_desc").textContent = CARPORT_MODES[mode].desc;
  applyModeVisibility();
  if (mode === "space") {
    applyCarportPacking();
    cabinetsDirty = cabinets.value.trim() !== "";   // 之前手动填的柜数保留，作为手动输入
    updateCabinetEstimate();
  } else {
    if (!cabinetsDirty) cabinets.value = "";          // 清掉整车位模式自动估算的柜数
    $("carport", "cabinets_hint").textContent = mode === "combo" ? "支架和组件同柜装运，运费只算一次。" : "";
  }
  clearOutputs("carport");
  setStatus("carport", "准备就绪");
}

function initCarport() {
  const key = "carport";
  document.querySelectorAll("#carport__mode_seg button").forEach((b) => b.addEventListener("click", () => setCarportMode(b.dataset.mode)));
  ["pack_type", "pack_container"].forEach((n) => $(key, n).addEventListener("change", () => {
    applyCarportPacking();
    cabinetsDirty = false;
    updateCabinetEstimate();
  }));
  ["spaces", "sets_per_cab", "mods_per_cab", "spaces_per_set", "pieces"].forEach((n) => $(key, n).addEventListener("input", updateCabinetEstimate));
  $(key, "cabinets").addEventListener("input", () => {
    cabinetsDirty = $(key, "cabinets").value.trim() !== "";   // 清空后恢复自动估算
    updateCabinetEstimate();
  });
  setCarportMode("bracket");
}

/* ============ 进项和销项税、按贸易条款锁定无关输入框 ============ */
function setLocked(key, name, locked) {
  const el = $(key, name);
  if (!el) return;
  el.disabled = locked;
  const field = el.closest(".field");
  if (field) field.classList.toggle("locked", locked);
}

function updateLocks(key) {
  const checked = $(key, "tax_on").checked;
  const term = $(key, "trade_term").value;
  const active = checked && TAX_TERMS.includes(term);

  // 税务局汇率、锁汇汇率：勾选且贸易条款为 FOB/CIF/DDP 才能输入
  TAX_FIELDS.forEach(([n]) => setLocked(key, n, !active));
  let hint = "不选则按现在的逻辑计算。";
  if (checked && term === "") hint = "请先选择贸易条款。";
  else if (checked && !active) hint = `贸易条款 ${term} 不涉及 FOB 价和销项税，仍按现在的逻辑计算（仅 FOB、CIF、DDP 使用）。`;
  else if (active) hint = "按“0%退税后测算”计算：采购成本按含税价 ÷1.13（进项），收入扣除销项税 = FOB价 × 税务局汇率 ÷1.13 × 13%，收入和费用按锁汇汇率折算。";
  $(key, "tax_hint").textContent = hint;

  // 与当前贸易条款无关的费用：锁定。没选贸易条款时全部可输入。
  Object.entries(FEE_RELEVANCE).forEach(([n, terms]) => {
    let lock = term !== "" && !terms.includes(term);
    if (n === "usd_rate" && active) lock = true;      // 进项和销项税下海运费用锁汇汇率（USD）换算
    setLocked(key, n, lock);
  });
  // 进项和销项税下，收入按锁汇汇率（EUR）折算，不再使用“汇率（EUR/CNY）”
  setLocked(key, "rate", active);
  $(key, "rate_btn").disabled = active;

  document.querySelectorAll(`#tool-${key} .tax-only`).forEach((el) => { el.hidden = !checked; });
}

/* ============ 初始化 ============ */
function applyPreset(key, value) {
  if (value === "") return;
  if (key === "pv" || key === "srau") {
    const p = (key === "pv" ? MODULE_PRESETS : SRAU_PRESETS)[Number(value)];
    if (!p) return;
    $(key, "model_w").value = p.w;
    $(key, "pieces").value = p.pcs;
    $(key, "cost_rmb").value = key === "pv" && taxActive(key) ? p.raw : p.cost;
  } else if (key === "carport") {
    if (value.startsWith("c:")) {
      $(key, "model_w").value = value.slice(2);
    } else if (value.startsWith("m:")) {
      // 组件系列的型号：同时带入组件成本（用于模式 2、3）
      const p = MODULE_PRESETS[Number(value.slice(2))];
      if (!p) return;
      $(key, "model_w").value = p.w;
      $(key, "m_cost").value = taxActive(key) ? p.raw : p.cost;
    }
  }
}

function switchTool(key) {
  Object.keys(TOOLS).forEach((k) => { document.getElementById(`tool-${k}`).hidden = k !== key; });
  document.getElementById("toolPill").textContent = TOOLS[key].name;
  document.querySelectorAll("#settingsMenu button").forEach((b) => b.classList.toggle("active", b.dataset.tool === key));
  clearError();
  try { localStorage.setItem("quote_tool_active", key); } catch (e) { /* 忽略 */ }
}

function init() {
  document.addEventListener("change", (e) => {
    if (e.target.matches('input[inputmode="decimal"]')) tidyNumberInput(e.target);
  });
  const app = document.getElementById("app");
  Object.keys(TOOLS).forEach((key) => {
    const section = document.createElement("section");
    section.id = `tool-${key}`;
    section.hidden = true;
    section.innerHTML = buildToolHTML(key);
    app.appendChild(section);

    const preset = $(key, "preset");
    if (preset) {
      preset.addEventListener("change", () => applyPreset(key, preset.value));
      // 手动改动后，快速选择恢复为“快速选择”，避免显示的选项和实际数值不一致
      const watched = key === "carport" ? ["model_w", "m_cost"] : ["model_w", "pieces", "cost_rmb"];
      watched.forEach((n) => $(key, n).addEventListener("input", () => { preset.value = ""; }));
    }
    // 贸易条款或“进项和销项税”改变：更新锁定状态；已选预设的成本按含税/不含税口径重新带入
    const refreshState = () => {
      updateLocks(key);
      const p = $(key, "preset");
      if (p && p.value !== "") applyPreset(key, p.value);
    };
    $(key, "trade_term").addEventListener("change", () => {
      $(key, "term_desc").textContent = TERM_DESC[$(key, "trade_term").value] || "";
      refreshState();
    });
    $(key, "tax_on").addEventListener("change", refreshState);
    updateLocks(key);
  });

  initCarport();

  $("carport", "file").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (f) handleDrawingFile(f);
    e.target.value = "";
  });

  const btn = document.getElementById("settingsBtn");
  const menu = document.getElementById("settingsMenu");
  const closeMenu = () => { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); };
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    menu.hidden = !menu.hidden;
    btn.setAttribute("aria-expanded", String(!menu.hidden));
  });
  menu.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { switchTool(b.dataset.tool); closeMenu(); }));
  document.addEventListener("click", closeMenu);

  let active = "pv";
  try { const saved = localStorage.getItem("quote_tool_active"); if (TOOLS[saved]) active = saved; } catch (e) { /* 忽略 */ }
  switchTool(active);

  refreshRate(null);
}

init();
</script>
